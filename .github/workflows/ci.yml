name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test-fast:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast tests
        run: pytest tests/ -v -m "not slow"

  test-slow:
    name: Slow tests (weekly / manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow tests
        run: pytest tests/ -v -m slow

  smoke-test:
    name: Clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fresh install and verify imports
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m cusum_watch.cli.main --help
          python -c "from cusum_watch.calibration.generate import CalibrationSample"
          python -c "from cusum_watch.stats.null_model import fit_null"
          python -c "from cusum_watch.proxy.litellm_hook import CusumWatchLogger"
          python -c "from cusum_watch.metrics.server import MetricsRegistry"
