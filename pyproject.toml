[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cusum-watch"
version = "0.2.0"
description = "Decoding-time drift monitor for quantized LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.10",
    "numpy>=1.20",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "prometheus_client>=0.17",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
calibration = [
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
cusum-watch = "cusum_watch.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cusum_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
